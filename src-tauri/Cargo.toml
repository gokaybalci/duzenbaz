[package]
name = "duzenbaz"
version = "1.5.0"
description = "Düzenbaz okul ders programı hazırlama"
authors = ["Düzenbaz"]
license = "GPL-3.0-or-later"
edition = "2021"

[lib]
name = "duzenbaz_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
