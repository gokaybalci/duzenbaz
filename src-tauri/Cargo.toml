[package]
name = "dersplan"
version = "1.0.0"
description = "Dersplan school timetable builder"
authors = ["Dersplan"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "dersplan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
